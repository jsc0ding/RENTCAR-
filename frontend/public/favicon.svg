<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bmwGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1c69d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d47a1;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Outer circle -->
  <circle cx="50" cy="50" r="48" fill="url(#bmwGradient)" stroke="#ffffff" stroke-width="2"/>
  
  <!-- Inner circle (BMW logo style) -->
  <circle cx="50" cy="50" r="40" fill="none" stroke="#ffffff" stroke-width="3"/>
  
  <!-- BMW quadrants -->
  <path d="M 50 10 L 50 50 L 90 50 A 40 40 0 0 0 50 10" fill="#ffffff"/>
  <path d="M 50 50 L 50 90 L 10 50 A 40 40 0 0 0 50 90" fill="#ffffff"/>
  
  <!-- Car icon in center -->
  <g transform="translate(50, 50)">
    <path d="M -15 -5 L -12 -10 L 12 -10 L 15 -5 L 18 0 L 18 8 L 15 10 L -15 10 L -18 8 L -18 0 Z" 
          fill="#1c69d4" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="-10" cy="10" r="3" fill="#333"/>
    <circle cx="10" cy="10" r="3" fill="#333"/>
    <rect x="-10" y="-8" width="8" height="5" fill="#87ceeb" opacity="0.7"/>
    <rect x="2" y="-8" width="8" height="5" fill="#87ceeb" opacity="0.7"/>
  </g>
</svg>
